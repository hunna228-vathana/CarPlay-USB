name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q OttoCarLink.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: OttoCarLink
      - run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: OttoCarLink
      - uses: actions/upload-artifact@v4
        with:
          name: OttoCarLink-apk
          path: OttoCarLink/app/build/outputs/apk/debug/*.apk
